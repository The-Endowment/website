name: Collection worker checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Existing DelegatePanel lint error on main is outside this worker PR.
      - run: npx eslint lib/holding lib/reporter lib/endowment.ts lib/keeper.ts scripts tests
      - run: npx eslint app/page.tsx app/layout.tsx app/endowment/page.tsx app/security/page.tsx app/api/progress/route.ts components/EndowmentProgress.tsx components/Chrome.tsx lib/progress.ts lib/progress-read.ts lib/site.ts
      - run: npm run build
